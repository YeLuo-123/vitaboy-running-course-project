# Target: vehicle-installed Nav2 Humble 1.1.6, mini_mec_robot URDF.
# Collision mesh XY bounds (base_link aligned with base_footprint):
# x=[-0.134809, 0.131491], y=[-0.114911, 0.115089] metres.
# Includes chassis, wheels, lidar and camera present in that URDF.
# Extra physical attachments not in the URDF require an updated footprint.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom_combined
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_model_type: likelihood_field
    laser_min_range: 0.2
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.95
    z_rand: 0.05
    do_beamskip: false
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.5
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    # Milliseconds. The vehicle logged action/service acknowledgement
    # timeouts with the upstream 20 ms default under CPU load.
    default_server_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    FollowPath:
      # Align with the path ahead before handing motion back to DWB.
      # Parameters match the Rotation Shim version installed on this vehicle.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.26
      forward_sampling_distance: 0.40
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      debug_trajectory_details: false
      min_vel_x: -0.05
      max_vel_x: 0.20
      # Prefer forward tracking; retain only small lateral corrections.
      min_vel_y: -0.02
      max_vel_y: 0.02
      max_vel_theta: 0.4
      # Avoid commands below the observed wheel deadband at the narrow doorway.
      min_speed_xy: 0.04
      max_speed_xy: 0.20
      min_speed_theta: 0.08
      acc_lim_x: 0.3
      acc_lim_y: 0.15
      acc_lim_theta: 0.6
      decel_lim_x: -0.3
      decel_lim_y: -0.15
      decel_lim_theta: -0.6
      vx_samples: 8
      vy_samples: 3
      vtheta_samples: 13
      sim_time: 1.7
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PreferForward, Twirling, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 1.0
      PreferForward.scale: 4.0
      PreferForward.penalty: 2.0
      PreferForward.strafe_x: 0.03
      PreferForward.strafe_theta: 0.15
      PreferForward.theta_scale: 1.0
      Twirling.scale: 2.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom_combined
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.135, -0.116], [-0.135, 0.116], [0.132, 0.116], [0.132, -0.116]]"
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          max_obstacle_height: 2.0
          obstacle_min_range: 0.2
          obstacle_max_range: 3.0
          raytrace_min_range: 0.2
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Operator-requested 5 cm soft inflation halo.
        inflation_radius: 0.05
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.135, -0.116], [-0.135, 0.116], [0.132, 0.116], [0.132, -0.116]]"
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        # Use the saved geometry for stable global routing. The local costmap
        # retains live scan obstacles and full footprint collision checking.
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: false
          max_obstacle_height: 2.0
          obstacle_min_range: 0.2
          obstacle_max_range: 3.0
          raytrace_min_range: 0.2
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # A soft cost gradient across doorways attracts NavFn to their centres.
        inflation_radius: 0.40
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.6

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.20, 0.02, 0.4]
    min_velocity: [-0.10, -0.02, -0.4]
    max_accel: [0.3, 0.15, 0.6]
    max_decel: [-0.3, -0.15, -0.6]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
